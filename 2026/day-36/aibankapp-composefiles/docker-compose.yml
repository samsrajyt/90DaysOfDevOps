services:
  frontend:
    build: .
    restart: always
    ports:
    - 8080:8080
    environment:
      MYSQL_ROOT_USER: root
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: Test@123
      MYSQL_HOST: mysqldb
      MYSQL_DATABASE: bankappdb 
      OLLAMA_URL: http://ollama:11434
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - bankapp-nw

  mysqldb:
    image: mysql:8.0.45-oracle
    restart: always
    ports:
    - 3306:3306
    environment:
      MYSQL_USER: user
      MYSQL_PASSWORD: password      
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: Test@123
      MYSQL_HOST: mysqldb
      MYSQL_DATABASE: bankappdb
    volumes:
    - sql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "mysqldb", "-u", "root", "-p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - bankapp-nw

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - bankapp-nw


      
volumes:
  sql-data:
  ollama_data:

networks:
  bankapp-nw:
    driver: bridge
