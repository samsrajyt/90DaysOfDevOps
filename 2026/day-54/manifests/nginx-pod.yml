kind: Pod
apiVersion: v1
metadata:
  name: nginx-configmap-pod
spec:
  containers:
    - name: nginx-container
      image: nginx:1.25
      ports: 
      - containerPort: 80
      volumeMounts:
      - name: config-volume
        mountPath: /etc/nginx/conf.d

  volumes:
    - name: config-volume
      configMap:
        name: nginx-config






