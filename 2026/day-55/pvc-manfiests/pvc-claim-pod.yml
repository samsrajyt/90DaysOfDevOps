kind: Pod
apiVersion: v1
metadata:
  name: pvc-pod
spec:
  volumes:
    - name: pv-storage
      persistentVolumeClaim:
        claimName: block-pvc
  containers:
    - name: busybox-container
      image: busybox:1.37
      command: ["/bin/sh", "-c" ,'echo "Date: $(date)" >> /data/message.txt; sleep 3600;']
      volumeMounts:
        - mountPath: "/data" 
          name: pv-storage

